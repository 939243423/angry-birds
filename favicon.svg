      <stop offset="1" stop-color="#8f1a12"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc44d"/>
      <stop offset="1" stop-color="#e0900f"/>
