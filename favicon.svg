<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="body" cx="35%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ff6b5e"/>
