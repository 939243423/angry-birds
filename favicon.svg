  </defs>

  <rect width="64" height="64" rx="14" fill="#101a2b"/>

  <!-- 尾羽 -->
  <path d="M16 30 L5 18 L9 32 L5 45 L18 38 Z" fill="#8f1a12"/>

  <!-- 身体 -->
  <circle cx="33" cy="33" r="20" fill="url(#body)"/>
  <!-- 右下暗部 -->
  <path d="M33 13a20 20 0 0 1 0 40 20 20 0 0 1 0-40z" fill="#000" opacity=".18"/>
  <!-- 肚皮 -->
  <ellipse cx="36" cy="42" rx="11" ry="8" fill="#ffe3b8"/>

  <!-- 头顶羽毛 -->
  <ellipse cx="28" cy="14" rx="6" ry="2.6" fill="#8f1a12" transform="rotate(-30 28 14)"/>
  <ellipse cx="36" cy="12" rx="6" ry="2.6" fill="#8f1a12" transform="rotate(-9 36 12)"/>

  <!-- 眼睛 -->
  <ellipse cx="28" cy="27" rx="6" ry="6.4" fill="#fff"/>
  <ellipse cx="40" cy="27" rx="6" ry="6.4" fill="#fff"/>
  <circle cx="29.6" cy="28" r="3" fill="#1b1b22"/>
  <circle cx="41.6" cy="28" r="3" fill="#1b1b22"/>
  <circle cx="30.8" cy="26.4" r="1.3" fill="#fff"/>
  <circle cx="42.8" cy="26.4" r="1.3" fill="#fff"/>

  <!-- 愤怒眉毛 -->
  <path d="M20 19.5 L29 24 M49 18.5 L39.5 23.5" stroke="#8f1a12" stroke-width="3.6" stroke-linecap="round" fill="none"/>

  <!-- 喙 -->
  <path d="M42 28.5 L58 32.6 L42 33.6 Z" fill="url(#beak)"/>
  <path d="M42 33.4 L58 32.6 L43 37.4 Z" fill="#e0900f"/>

