# 注意：新版 Docker Compose 已废弃顶层 version 字段，写了会告警，这里不再声明。
services:
  # 纯静态前端（Nginx 托管）
  html_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: angry-birds:latest
    container_name: angry_birds_3011
    ports:
      # 宿主机 3011 → 容器 80
      - "3011:80"
    restart: always
    # 日志轮转，避免长期运行把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
