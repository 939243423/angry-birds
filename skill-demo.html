<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>技能测试靶场 · 愤怒的小鸟元素纪元</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- 注意：不引入 css/style.css —— 主样式表里 #hud / #stage 是绝对定位，
     会把我的卡片 / 按钮吞掉。Demo 自带完整 <style> 段（见 <head>）。 -->
<style>
  body { background: #101a2b; margin: 0; padding: 0; min-height: 100vh; font-family: system-ui, "Segoe UI", sans-serif; color: #e8eaed; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 14px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .hint { font-size: 13px; color: #9aa0a6; max-width: 880px; line-height: 1.6; text-align: center; }
  .hint code { background: #202124; padding: 1px 6px; border-radius: 4px; color: #f0c674; font-size: 12px; }
  #stage-wrap { position: relative; width: min(100vw, 1280px); aspect-ratio: 16/9; max-height: 70vh;
                background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,.5); }
  #stage-wrap canvas { display: block; width: 100%; height: 100%; }
  #hud { display: flex; flex-wrap: wrap; gap: 12px; width: min(100vw, 1280px); align-items: center; justify-content: space-between; }
  #birds { display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; width: min(100vw, 1280px); }
  .bird-card { background: #1f2230; border: 2px solid transparent; border-radius: 10px; padding: 8px 6px;
               cursor: pointer; user-select: none; text-align: center; transition: transform .12s, border-color .12s, background .12s; }
  .bird-card:hover { transform: translateY(-2px); }
  .bird-card.active { border-color: #f0c674; background: #2b2e44; }
  .bird-card .name { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .bird-card .skill { font-size: 11px; color: #9aa0a6; margin-top: 2px; }
  .bird-card .dot { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto; box-shadow: inset -4px -4px 6px rgba(0,0,0,.35); }
  .bird-card .hint-txt { font-size: 10px; color: #bdc1c6; margin-top: 4px; line-height: 1.3; min-height: 28px; }
  #controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button.ctrl { background: #2b2e44; color: #e8eaed; border: 1px solid #3c4258; border-radius: 8px;
                padding: 8px 16px; font-size: 13px; cursor: pointer; transition: background .12s; }
  button.ctrl:hover { background: #3a3e58; }
  button.ctrl.primary { background: #c25a00; border-color: #c25a00; }
  button.ctrl.primary:hover { background: #d96a10; }
  button.ctrl.danger { background: #8a3324; border-color: #8a3324; }
  button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
  #status { display: flex; gap: 16px; font-size: 13px; color: #bdc1c6; }
  #status strong { color: #f0c674; font-weight: 600; }
  #log { width: min(100vw, 1280px); max-height: 140px; overflow-y: auto; background: #16181f;
         border: 1px solid #2b2e44; border-radius: 8px; padding: 8px 12px; font: 12px ui-monospace, Consolas, monospace;
         color: #bdc1c6; line-height: 1.5; }
  #log .ok { color: #8bc34a; } #log .warn { color: #f0c674; } #log .err { color: #ef5350; }
  @media (max-width: 760px) {
    #birds { grid-template-columns: repeat(3, 1fr); }
    h1 { font-size: 16px; } .hint { font-size: 12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>🧪 技能测试靶场 — 9 只鸟逐只验证</h1>
  <div class="hint">
    点卡片切换<strong>当前要测的鸟种</strong> → 卡片高亮 → 点 <code>发射并自动放技能</code> 一键测完。
    也可以点卡片后用鼠标<strong>拖拽弹弓</strong>手动发射，飞行中 <strong>按空格 / 点屏幕</strong> 触发技能。
    9 种技能彼此独立，目标：亲眼看到<strong>每只鸟放技能时画面都有不同反应</strong>。
  </div>

  <div id="hud">
    <div id="status">
      <div>当前：<strong id="s-current">红</strong></div>
      <div>剩余：<strong id="s-queue">9</strong></div>
      <div>状态：<strong id="s-state">待发射</strong></div>
      <div>分数：<strong id="s-score">0</strong></div>
      <div>靶场：<strong id="s-pigs">8 猪 + 1 TNT</strong></div>
    </div>
    <div id="controls">
      <button class="ctrl primary" id="btn-auto">▶ 发射并自动放技能</button>
      <button class="ctrl" id="btn-launch">发射（不动技能）</button>
      <button class="ctrl" id="btn-skill">触发技能</button>
      <button class="ctrl danger" id="btn-reset">重置靶场</button>
    </div>
  </div>

  <div id="birds"></div>

  <div id="stage-wrap"><canvas id="game"></canvas></div>

  <div id="log">就绪。等你点卡片或按钮。</div>
</div>

<!-- 与 index.html 完全相同的脚本顺序；Game 期望这些全局都先存在 -->
<script src="js/utils.js"></script>
<script src="js/audio.js"></script>
<script src="js/music.js"></script>
<script src="js/particles.js"></script>
<script src="js/physics.js"></script>
<script src="js/entities.js"></script>
<script src="js/levels.js"></script>
<script src="js/render.js"></script>
<script src="js/egggame.js"></script>
<script src="js/game.js"></script>

<script>
/* ===========================================================
 * 技能测试靶场 — 复用 Game 与 Bird 的真实实现
 * 思路：直接 new Game(canvas) → 手搭关卡场景 → 程序化发射 → useSkill
 * =========================================================== */
'use strict';

const BIRD_LIST = ['red','yellow','blue','black','green','violet','orange','white','giant'];
const BIRD_COLORS = {
  red:'#e0362c', yellow:'#ffcf1f', blue:'#3aa6f0', black:'#3b3b45',
  green:'#4fc94f', violet:'#9b5cf0', orange:'#ff8c1a', white:'#f2f5f9',
  giant:'#8f1a12'
};

const $ = (sel) => document.querySelector(sel);
const log = (msg, cls = '') => {
  const el = $('#log');
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  el.innerHTML += `<div${cls ? ` class="${cls}"` : ''}>[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
};
const setStatus = () => {
  $('#s-current').textContent = g.currentBird ? g.currentBird.def.name : '（无）';
  $('#s-queue').textContent = g.birdQueue.length;
  $('#s-score').textContent = g.score;
  if (g.currentBird) {
    const b = g.currentBird;
    $('#s-state').textContent =
      b.state === 'flying' ? '飞行中…（可放技能）' :
      b.state === 'resting' ? '已落地' :
      b.state === 'dead'    ? '已消亡' : '待发射';
  }
};

/* -------- 渲染 9 张卡片 -------- */
{
  const box = $('#birds');
  BIRD_LIST.forEach((k) => {
    const d = BIRD_TYPES[k];
    const card = document.createElement('div');
    card.className = 'bird-card';
    card.dataset.type = k;
    card.innerHTML = `
      <div class="dot" style="background:${BIRD_COLORS[k]}"></div>
      <div class="name">${d.name}</div>
      <div class="skill">${d.skill}</div>
      <div class="hint-txt">${d.hint}</div>`;
    card.addEventListener('click', () => switchBird(k));
    box.appendChild(card);
  });
}

/* -------- 构造 Game 与靶场 -------- */
const canvas = $('#game');
const g = new Game(canvas);
g.loadLevel(0);  // 先借 L1 的 decor / camera / 物理场景
g.birdQueue = []; g.birds = []; g.currentBird = null;
g.world.wind = 0;
g.phase = 'aim';

// 删掉 L1 自带的砖与猪，我们自己搭一个多目标靶场
for (const b of g.blocks) if (b.body) b.body.removed = true;
for (const p of g.pigs)  if (p.body) p.body.removed = true;
g.blocks.length = 0; g.pigs.length = 0;
g.particles.clear();
g.score = 0;

/* 主靶场：三柱结构覆盖 wood/stone/ice + 1 TNT + 8 猪
 *
 * 关键：所有 y 坐标一律用 levels.js 的 stack()/beam() 自动堆叠算出来，
 * **绝不手算**。手算极易出现"砖悬空 → 自由落体 → TNT 受击即爆 →
 * 把自家塔连同猪一起炸光"的连锁事故。
 * 本 demo 第一版就踩过：梁悬空 17px、TNT 又悬空 8px，开局 200ms 内
 * 中央塔自爆，分数凭空 +8400、少了 4 块砖和 1 只猪。 */
function setupRange() {
  // ---- 中央高塔：木柱 ×2 + 横梁 + TNT 精确定位在梁顶 ----
  const cTop = stack([], 1000, [['wood', 30, 110]]);      // 柱顶 y（与右柱等高）
  stack([], 1180, [['wood', 30, 110]]);
  g.addBlock({ mat: 'wood', x: 1000, y: GROUND_Y - 55, w: 30, h: 110 });
  g.addBlock({ mat: 'wood', x: 1180, y: GROUND_Y - 55, w: 30, h: 110 });
  // beam() 返回横梁的新顶部 y；梁中心 = 柱顶 - 梁高/2
  const beamTop = beam([], 'wood', 1090, cTop, 240, 26);
  g.addBlock({ mat: 'wood', x: 1090, y: cTop - 13, w: 240, h: 26 });
  // TNT 坐在梁顶：中心 = 梁顶 - TNT高/2（不悬空 → 不会自由落体触发自爆）
  g.addBlock({ mat: 'tnt', x: 1090, y: beamTop - 25, w: 50, h: 50 });

  // ---- 左石塔：石柱 ×2 + 木梁 + 猪 ----
  const lt = [];
  const ltTop = stack(lt, 800, [['stone', 44, 44], ['stone', 44, 44]]);
  const ltBeamTop = beam(lt, 'wood', 800, ltTop, 110, 22);
  lt.forEach(o => g.addBlock(o));
  g.addPig({ type: 'normal', x: 800, y: ltBeamTop - 26 });

  // ---- 右冰塔（蓝鸟专属目标：ice 材质，蓝鸟一击可穿）----
  const ri = [];
  const riTop = stack(ri, 1380, [['ice', 44, 44], ['ice', 44, 44]]);
  const riBeamTop = beam(ri, 'ice', 1380, riTop, 110, 22);
  ri.forEach(o => g.addBlock(o));
  g.addPig({ type: 'normal', x: 1380, y: riBeamTop - 26 });

  // ---- 弹弓后方悬空高台（回旋绿 / 引力紫专属目标）----
  // static:true 永不下落，只有"折返"或"吸扯"才能碰到
  g.addBlock({ mat: 'stone', x: 600, y: GROUND_Y - 380, w: 200, h: 26, static: true });
  g.addPig({ type: 'small', x: 600, y: GROUND_Y - 380 - 13 - 19 });
  g.addPig({ type: 'small', x: 660, y: GROUND_Y - 380 - 13 - 19 });

  // ---- 地面散落小目标（给分裂 / 空投 / 膨胀提供多目标）----
  g.addPig({ type: 'small', x: 1100, y: GROUND_Y - 19 });
  g.addPig({ type: 'small', x: 1280, y: GROUND_Y - 19 });
  g.addPig({ type: 'small', x: 940,  y: GROUND_Y - 19 });
  g.addPig({ type: 'helmet', x: 1450, y: GROUND_Y - 28 });
}
setupRange();

// 9 只鸟轮换池：每次切换类型时把 currentBird 改成对应新鸟
function spawnBirdOfType(type) {
  const b = new Bird(type, SLING.x, SLING.y - 14);
  g.birds.push(b);
  g.currentBird = b;
  g.phase = 'aim';
  // 取消任何"飞行中残留待处理技能"
  g.pendingSkill = false;
  log(`切换到 <strong>${BIRD_TYPES[type].name}</strong>（技能：${BIRD_TYPES[type].skill}）`);
  highlight(type);
  setStatus();
}

function highlight(type) {
  document.querySelectorAll('.bird-card').forEach(c => {
    c.classList.toggle('active', c.dataset.type === type);
  });
}

function switchBird(type) {
  // 如果还在飞，先等它落地或消亡
  if (g.currentBird && g.currentBird.state === 'flying') {
    log(`<span class="warn">⚠ 当前鸟还在飞，先发射并放完技能再切</span>`);
    return;
  }
  spawnBirdOfType(type);
}

// 初始鸟种：优先读 URL hash（#bird=black）——主菜单图鉴点某只鸟会这样跳进来
function typeFromHash() {
  const h = (location.hash.match(/bird=([a-z]+)/) || [])[1];
  return BIRD_LIST.includes(h) ? h : null;
}
const hashType = typeFromHash();
const initialType = hashType || 'red';
spawnBirdOfType(initialType);
if (hashType) {
  log(`从主菜单图鉴跳转而来，已自动选中 <strong>${BIRD_TYPES[initialType].name}</strong>`, 'ok');
}
// 页面已打开时又改 hash（例如从别的页面再次跳转过来）也要跟着切
window.addEventListener('hashchange', () => {
  const t = typeFromHash();
  if (t && g.currentBird && g.currentBird.type !== t && g.currentBird.state !== 'flying') {
    spawnBirdOfType(t);
  }
});

/* -------- 按钮事件 -------- */
$('#btn-launch').addEventListener('click', () => {
  const b = g.currentBird;
  if (!b || b.state === 'flying' || b.state === 'dead') {
    log('<span class="warn">⚠ 没有可发射的鸟</span>'); return;
  }
  // 统一力度：保证每只鸟都能打到主靶场中段
  const vx = 900, vy = -260;
  g.launch(b, vx, vy);
  log(`发射 → vx=${vx}, vy=${vy}（约 30° 仰角，命中主靶场中段）`);
  setStatus();
});

$('#btn-skill').addEventListener('click', () => {
  const b = g.currentBird;
  if (!b || b.state !== 'flying') {
    log('<span class="warn">⚠ 鸟不在飞行状态（按 Space / 点屏幕也行）</span>'); return;
  }
  if (b.skillUsed) {
    log('<span class="warn">⚠ 这只鸟的技能已用过了</span>'); return;
  }
  const ok = b.useSkill(g);
  if (ok) log(`<span class="ok">✦ 释放技能：${b.def.skill}</span>`, 'ok');
  setStatus();
});

$('#btn-auto').addEventListener('click', async () => {
  $('#btn-auto').disabled = true;
  log('=== 开始自动测试：9 只鸟逐只发射并触发技能 ===', 'warn');

  const report = [];
  // 每只鸟测完后比对的"世界快照"
  const snap = () => ({
    birds: g.birds.length, wells: g.wells.length, drops: g.drops.length,
    score: g.score,
    alivePigs: g.pigs.filter(p => !p.dead).length,
    aliveBlocks: g.blocks.filter(x => !x.dead).length,
  });
  for (const type of BIRD_LIST) {
    // 校验/自动测试场景要**强制切鸟**，不能走 switchBird 的"还在飞就别切"守卫
    // —— 靶场没有游戏的 afterShot 流程，鸟可能永远停在 flying（踩过）
    if (g.currentBird && g.currentBird.type === type && g.currentBird.state !== 'flying') {
      log(`（${BIRD_TYPES[type].name} 已在弹弓上）`);
    } else {
      if (g.currentBird && g.currentBird.body) g.currentBird.body.removed = true;
      spawnBirdOfType(type);
    }
    const b = g.currentBird;
    const d = BIRD_TYPES[type];
    log(`-- ${d.name} (${d.skill}) --`);

    const s0 = snap();
    const preBirds = g.birds.length, preWells = g.wells.length, preDrops = g.drops.length;

    // 发射
    g.launch(b, 900, -260);

    // pre 快照在**发射之后**取：这样 sig 的差只反映「技能」的贡献，
    // 而不是「发射」本身（发射也会改 vx，会污染签名）
    const pre = { armedBlast: b.armedBlast, power: b.power, fuse: b.fuse, r: b.r, vx: b.vx, vy: b.vy };

    // 等鸟飞离弹弓一段距离再放技能。用「飞行状态 + 已飞距离」轮询而非固定等待：
    // 上一只鸟的爆炸会触发 fx.timeScale 慢放，真实 400ms 可能只推进 1 帧。
    {
      const startX = b.x;
      let poll = 0;
      while (poll < 60) {
        await wait(60); poll++;
        if (b.state !== 'flying') break;
        if (Math.abs(b.x - startX) > 180) break;
      }
    }

    let fired = false, errMsg = '';
    if (b.state === 'flying' && !b.skillUsed) {
      try { fired = !!b.useSkill(g); } catch (e) { errMsg = String(e); }
      log(fired ? `<span class="ok">✦ 自动放技能成功：${d.skill}</span>`
                : `<span class="err">✗ 技能失败${errMsg ? '：' + errMsg : ''}</span>`);
    } else if (b.skillUsed) {
      fired = true;
      log(`<span class="warn">（技能已自动触发）</span>`);
    } else {
      log(`<span class="err">✗ 触发技能时鸟状态异常：${b.state}</span>`);
    }

    // ★ sig 必须在 useSkill 的**同一时刻**采样 —— 一旦等鸟落地再算，
    //   速度/半径等早已被物理推进改掉，测出来全是"无签名变化"（踩过）。
    const sig = [];
    if (pre.armedBlast !== b.armedBlast) sig.push(`armedBlast=${b.armedBlast}`);
    if (b.power !== pre.power) sig.push(`power=${b.power}`);
    if (b.fuse !== pre.fuse) sig.push(`fuse=${b.fuse}`);
    if (Math.abs(b.r - pre.r) > 0.01) sig.push(`r=${b.r.toFixed(1)}`);
    if (pre.vx !== 0 && Math.sign(b.vx) !== Math.sign(pre.vx)) sig.push('vx反向');
    else if (Math.abs(pre.vx) > 1 && Math.abs(b.vx) > Math.abs(pre.vx) * 1.5) {
      sig.push(`|vx|×${(Math.abs(b.vx) / Math.abs(pre.vx)).toFixed(2)}`);
    }
    if (g.birds.length > preBirds) sig.push(`分裂+${g.birds.length - preBirds}`);
    if (g.wells.length > preWells) sig.push(`引力场+${g.wells.length - preWells}`);
    if (g.drops.length > preDrops) sig.push(`空投+${g.drops.length - preDrops}`);
    if (type === 'giant' && b.dead) sig.push('引爆');

    // 等鸟"结束本次飞行"。靶场没有游戏的 afterShot 流程，state 可能永远停在
    // flying，故改用两条可靠判据：① 已静止（连续若干帧位置几乎不变）
    // ② 飞出世界边界 ③ 硬超时 6s
    let waited = 0, stillFrames = 0, lastX = b.x, lastY = b.y;
    while (waited < 6000) {
      await wait(80); waited += 80;
      const moved = Math.hypot(b.x - lastX, b.y - lastY);
      lastX = b.x; lastY = b.y;
      if (moved < 1.2) stillFrames++; else stillFrames = 0;
      if (stillFrames >= 4) break;                                        // 静止 ~300ms
      if (b.x > WORLD_W + 200 || b.x < -400 || b.y > GROUND_Y + 600) break; // 出界
      if (b.dead) break;
    }
    await wait(200);

    const s1 = snap();

    const killed = s0.alivePigs - s1.alivePigs;
    const broke = s0.aliveBlocks - s1.aliveBlocks;
    const gained = s1.score - s0.score;

    report.push({
      name: d.name, skill: d.skill, fired, sig: sig.join(' / ') || '（无签名变化！）',
      killed, broke, gained, finalState: b.state,
    });
    log(`落地：state=${b.state}，击杀 ${killed} 猪 / ${broke} 砖，得分 +${gained}`);
    await wait(350);
  }

  // ---- 汇总表 ----
  const allFired = report.every(r => r.fired);
  const allSigned = report.every(r => !r.sig.includes('无签名变化'));
  const rows = report.map(r => `
    <tr style="border-bottom:1px solid #2b2e44">
      <td style="padding:3px 8px;color:${r.fired ? '#8bc34a' : '#ef5350'}">${r.fired ? '✓' : '✗'}</td>
      <td style="padding:3px 8px">${r.name}</td>
      <td style="padding:3px 8px;color:#9aa0a6">${r.skill}</td>
      <td style="padding:3px 8px;color:#f0c674">${r.sig}</td>
      <td style="padding:3px 8px">${r.killed}</td>
      <td style="padding:3px 8px">${r.broke}</td>
      <td style="padding:3px 8px">+${r.gained}</td>
      <td style="padding:3px 8px;color:#9aa0a6">${r.finalState}</td>
    </tr>`).join('');

  log(`=== 自动测试完成：${report.filter(r => r.fired).length}/9 只鸟技能触发成功 ===`,
      allFired ? 'ok' : 'err');
  log(`<table style="width:100%;border-collapse:collapse;margin-top:6px">
      <thead><tr style="color:#9aa0a6;text-align:left;border-bottom:1px solid #3c4258">
        <th style="padding:3px 8px">结果</th><th style="padding:3px 8px">鸟</th>
        <th style="padding:3px 8px">技能</th><th style="padding:3px 8px">技能签名（状态变化）</th>
        <th style="padding:3px 8px">杀猪</th><th style="padding:3px 8px">破砖</th>
        <th style="padding:3px 8px">得分</th><th style="padding:3px 8px">结束态</th>
      </tr></thead><tbody>${rows}</tbody></table>`);

  if (!allSigned) {
    log('<span class="err">⚠ 有鸟放技能后没有任何状态变化，疑似哑火，请看上表</span>');
  }

  // 同步到控制台，方便复制给别人
  console.table(report);

  $('#btn-auto').disabled = false;
});

$('#btn-reset').addEventListener('click', () => {
  // 清干净所有刚体
  for (const b of g.blocks) if (b.body) b.body.removed = true;
  for (const p of g.pigs)  if (p.body) p.body.removed = true;
  for (const bd of g.birds) if (bd.body) bd.body.removed = true;
  g.wells.length = 0; g.drops.length = 0; g.pendingBooms.length = 0;
  g.blocks.length = 0; g.pigs.length = 0; g.birds.length = 0;
  g.particles.clear();
  g.score = 0; g.birdQueue = []; g.currentBird = null; g.phase = 'aim';
  setupRange();
  spawnBirdOfType(g.currentBird ? g.currentBird.type : 'red');
  log('靶场已重置', 'ok');
});

/* -------- 空格键 = 触发技能（沿用 Game 的语义）-------- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    if (g.currentBird && g.currentBird.state === 'flying') {
      const ok = g.currentBird.useSkill(g);
      if (ok) log(`<span class="ok">✦ 空格放技能：${g.currentBird.def.skill}</span>`);
    }
  }
});

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

/* -------- RAF 循环 + 状态同步 -------- */
function loop() {
  g.update(1 / 60);
  setStatus();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

log('靶场就绪：3 柱结构 + 1 TNT + 1 悬空后高台 + 8 猪。每只鸟都「能打中、有意义」。', 'ok');

// 控制台调试句柄：方便用户 / 自动化测试探测 game 状态
window.__g = g;
window.__birds = BIRD_TYPES;
window.__resetRange = () => $('#btn-reset').click();
</script>
