worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 不在响应头暴露 Nginx 版本号
    server_tokens off;

    underscores_in_headers on;

    # Gzip：纯静态文本压缩后体积大幅减小（本项目 JS + CSS 约 190KB → 约 50KB）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_vary on;

    server {
        listen 80;
        server_name _;

        # charset 默认只作用于 text/html，这里显式扩展到 CSS / JS
        charset utf-8;
        charset_types text/css application/javascript application/json text/plain;

        # 网站根目录
        root /usr/share/nginx/html;
        index index.html index.htm;

        # 基础安全响应头
        # 注意：nginx 的 add_header 一旦在子级 location 里出现就不会再继承 server 级，
        # 因此下面各 location 统一改用 expires 控制缓存（不写 add_header），
        # 以此保证这三行在全部响应上都生效。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 静态文件路由：请求的文件 -> 目录 -> 404
        location / {
            try_files $uri $uri/ =404;
        }

        # HTML / CSS / JS 一律走协商缓存（expires -1 ⇒ Cache-Control: no-cache，未修改返回 304）
        # 本项目资源是固定文件名、没有内容指纹，
        # 若对这些文件用 expires 30d 强缓存，更新部署后老用户会一直用旧缓存、看不到变化。
        location ~* \.(html|htm|css|js)$ {
            expires -1;
        }

        # favicon 系列是固定文件名，换图标后要能立刻生效，故单独走协商缓存
        # （正则在下面的长缓存规则之前，先匹配先生效）
        location ~ ^/favicon[^/]*\.(svg|png|ico)$ {
            expires -1;
        }

        # 只有内容不会变的资源才做长缓存
        # （只用 expires，不写 add_header，避免打断 server 级安全头的继承）
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
        }
    }
}
